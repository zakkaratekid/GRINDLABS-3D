<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="contact-page">
  <nav class="site-nav">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="services.html">Our Services</a>
    <a href="projects.html">Projects</a>
    <a class="active" href="contact.html">Contact</a>
  </nav>

  <form
    action="https://formspree.io/f/mvzyneel"
    class="fs-form"
    method="POST"
  >
    <h1>Contact</h1>
    <p class="fs-description">Send a message about BMX builds, 3D printing ideas, custom parts, or project feedback.</p>

    <input type="hidden" name="_subject" value="New message from GRINDLABS 3D">
    <input class="fs-hidden" type="text" name="_gotcha" tabindex="-1" autocomplete="off">

    <div class="fs-field">
      <label class="fs-label" for="name">Your Name</label>
      <input class="fs-input" id="name" name="name" type="text" autocomplete="name" required>
    </div>

    <div class="fs-field">
      <label class="fs-label" for="email">Email</label>
      <input class="fs-input" id="email" name="email" type="email" autocomplete="email" required>
      <p class="fs-description">This will help me respond to your query via email.</p>
    </div>

    <div class="fs-field">
      <label class="fs-label" for="message">Message</label>
      <textarea class="fs-textarea" id="message" name="message" required></textarea>
      <p class="fs-description">What would you like to discuss?</p>
    </div>

    <div class="fs-button-group">
      <button class="fs-button" type="submit">Submit</button>
    </div>
  </form>
</body>
</html>
