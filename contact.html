<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body class="contact-page">
  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="services.html">Our Services</a>
    <a href="projects.html">Projects</a>
    <a class="active" href="contact.html">Contact</a>
  </nav>

  <form class="fs-form" action="https://formspree.io/f/mvzyneel" method="POST">
    <h1>Contact</h1>

    <div class="fs-field">
      <label class="fs-label" for="name">Your Name</label>
      <input class="fs-input" id="name" name="name" required>
    </div>

    <div class="fs-field">
      <label class="fs-label" for="email">Email</label>
      <input class="fs-input" id="email" name="email" type="email" required>
      <p class="fs-description">This will help me respond to your query by email.</p>
    </div>

    <div class="fs-field">
      <label class="fs-label" for="message">Message</label>
      <textarea class="fs-textarea" id="message" name="message" required></textarea>
      <p class="fs-description">What would you like to discuss?</p>
    </div>

    <button class="fs-button" type="submit">Submit</button>
  </form>
</body>
</html>
